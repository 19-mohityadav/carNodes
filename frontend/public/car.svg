<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" fill="none">
  <!-- Car Silhouette Icon (Left) -->
  <g transform="translate(2, 2)">
    <!-- Aerodynamic Roofline & Windshield -->
    <path d="M4 28 C6 22, 11 13, 20 10 C27 7.5, 37 7.5, 42 10 C46 12, 50 17, 54 23 L54 28 Z" 
          fill="url(#carGlow)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Windshield separator -->
    <path d="M21 10 C25 8.5, 33 8.5, 37 10" 
          stroke="#B89B5E" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Beltline -->
    <path d="M2 28 L56 28" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>

    <!-- Front & Rear Wheel Arches with Node Hubs -->
    <circle cx="14" cy="28" r="6" fill="#FDFBF7" stroke="#1E293B" stroke-width="2"/>
    <circle cx="14" cy="28" r="2.5" fill="#B89B5E"/>

    <circle cx="44" cy="28" r="6" fill="#FDFBF7" stroke="#1E293B" stroke-width="2"/>
    <circle cx="44" cy="28" r="2.5" fill="#FF3B30"/>

    <!-- Front & Rear bumper curves -->
    <path d="M4 28 C3 29, 2 31, 2 33 L8 33" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M54 28 C55 29, 56 31, 56 33 L50 33" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Front Headlight & Rear Taillight Accents -->
    <circle cx="5" cy="26" r="1.5" fill="#B89B5E"/>
    <circle cx="53" cy="26" r="1.5" fill="#FF3B30"/>
  </g>

  <!-- Typography: carNodes -->
  <text x="68" y="27" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.03em" fill="#111111">car<tspan fill="#FF3B30">Nodes</tspan></text>

  <!-- RWA Protocol Badge -->
  <rect x="174" y="14" width="38" height="16" rx="4" fill="#B89B5E" fill-opacity="0.15" stroke="#B89B5E" stroke-width="1"/>
  <text x="193" y="25.5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.08em" fill="#947638" text-anchor="middle">RWA</text>

  <defs>
    <linearGradient id="carGlow" x1="4" y1="8" x2="54" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B89B5E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF3B30" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
</svg>

